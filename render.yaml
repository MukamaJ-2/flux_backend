services:
  - type: web
    name: flux-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate && gunicorn flux_core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: flux-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-url.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://your-frontend-url.vercel.app
      - key: DATABASE_URL
        value: postgresql://user:password@host:5432/dbname
